<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relentless – Rennrad-Trainingsplan</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relentless">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071747">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f5f9fa;--panel:#ffffff;--line:#d3e1e5;--ink:#0b1c49;--mute:#5b6f80;--ice:#00bcb3;--teal:#007f8d;--navy:#071747;--tint:#eaf3f5;--ok:#0a8f6a}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;margin:0;-webkit-tap-highlight-color:transparent}
  .hd{font-family:'Arial Black',Impact,'Geist',sans-serif;font-weight:900!important;letter-spacing:-.02em;text-transform:uppercase}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0;box-shadow:0 1px 0 rgba(11,28,73,.04)}
  .rounded-xl,.rounded-2xl,.rounded-lg{border-radius:0!important}
  .inp{width:100%;background:#fff;border:1px solid var(--line);border-radius:0;padding:.8rem .9rem;color:var(--ink);font-size:1rem}
  .inp:focus,button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
  .btn{background:var(--ink);color:#fff;font-weight:800;font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;border-radius:0;padding:.95rem 1.2rem;transition:transform .12s,background .15s}
  .btn:hover{background:var(--teal)}
  .btn:active{transform:scale(.97)}
  .ghost{border:1px solid var(--ink);border-radius:0;padding:.8rem 1rem;color:var(--ink);font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
  .btn.lbl,.ghost.lbl{text-transform:none;letter-spacing:0;font-size:.85rem;text-align:left}
  .hd{overflow-wrap:break-word;hyphens:auto}
  .brand .hd,.brand .hd *{hyphens:none;white-space:nowrap}
  b.rounded-full{white-space:nowrap}
  .nw{white-space:nowrap}
  .gl{border-bottom:1px dotted currentColor;cursor:help;outline-offset:2px}
  .gltip{position:absolute;z-index:90;display:none;background:#0b1c49;color:#fff;padding:10px 12px;font-size:.82rem;line-height:1.4;box-shadow:0 6px 24px rgba(7,23,71,.35);border-left:3px solid var(--ice);text-transform:none;letter-spacing:0;font-weight:400}
  .gltip b{font-weight:700}
  .ghost:hover{background:var(--ink);color:#fff}
  .eyebrow{color:var(--teal);font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  .brand{background:var(--navy);color:#fff;border-bottom:3px solid var(--ice);margin:-1.25rem -16px 0;padding:.8rem 16px;box-shadow:0 0 0 100vmax var(--navy);clip-path:inset(0 -100vmax)}
  .brand .ghost{border-color:#fff;color:#fff}.brand .ghost:hover{background:#fff;color:var(--navy)}.brand .text-sm{color:#9fb4c8!important}
  .flash{animation:fl 1.4s ease-out 1}
  @keyframes fl{0%{box-shadow:0 0 0 0 rgba(10,143,106,.6)}100%{box-shadow:0 0 0 18px rgba(10,143,106,0)}}
  .spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.flash,.spin{animation:none}}

  .exov{position:fixed;inset:0;z-index:60;background:rgba(7,23,71,.6);display:flex;align-items:center;justify-content:center;padding:12px}
  .exbox{background:#fff;color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:16px;border:1px solid var(--line)}
  .exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .exf svg{width:100%;height:auto;background:var(--tint);border:1px solid var(--line);display:block}
  .exc{font-size:.75rem;color:var(--mute);margin-top:4px;line-height:1.3}
  .ln polyline{stroke:var(--navy);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .ln .ln2{stroke:var(--teal)}
  .hd2{fill:var(--navy)}
  .eq{fill:#fff;stroke:var(--line);stroke-width:2}
  .pl{fill:var(--teal)}
  .gr{stroke:var(--line);stroke-width:2}
  .ar line,.ar polyline{stroke:var(--ice);stroke-width:2.5;stroke-linecap:round;fill:none}
  .cb{stroke:var(--teal);stroke-width:2;stroke-dasharray:4 3}
  .exl{color:var(--teal);text-decoration:underline;text-underline-offset:3px;font-weight:600;text-align:left}

  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;background:#fff;border:1px solid var(--line);text-align:left;color:var(--ink);min-height:112px;cursor:pointer}
  .tile:hover,.tile:focus-visible{border-color:var(--ice)}
  .tile .exf svg{width:100%;height:auto;background:var(--tint);border:1px solid var(--line);display:block}

  .dchip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);background:#fff;font-size:.75rem;color:var(--ink)}
  .dtabs{display:flex;gap:0;border:1px solid var(--line)}
  .dtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:.55rem .4rem;font-size:.8rem;font-weight:600;color:var(--mute);background:#fff;border-right:1px solid var(--line)}
  .dtabs button:last-child{border-right:0}
  .dtabs button.on{background:var(--navy);color:#fff}

  .hero{background:var(--navy);color:#fff;padding:18px;border-left:6px solid var(--ice)}
  .hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .hero .hd.text-3xl{font-size:1.9rem;line-height:1.1}
  .hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px}
  .hchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(255,255,255,.45);font-size:.85rem;font-weight:600;color:#fff;background:transparent;cursor:pointer}
  .hchip.on{background:#fff;color:#071747;border-color:#fff}
  .hpane{margin-top:10px;background:#fff;color:var(--ink);padding:14px;font-size:.875rem}
  .hpane > div > * + *{margin-top:8px}
  .hbtn{background:var(--ice);color:#071747;font-weight:700;padding:.6rem .9rem;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
  .hbtn2{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}

  .exanim .exf svg{max-width:360px;margin:0 auto}
  .exph{flex:1;padding:5px 8px;border:1px solid var(--line);color:var(--mute);font-size:.75rem;line-height:1.3;transition:all .2s}
  .exph.on{border-color:var(--ice);color:var(--ink);background:#e6f7f6}

  .wsec > summary{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;list-style:none}
  .wsec > summary::-webkit-details-marker{display:none}
  .wsec > summary > span:first-child{flex:1}
  .wsec[open] .wchev{transform:rotate(180deg)}
  .wchev{color:var(--teal);transition:transform .15s}
  .wbody{padding:0 16px 16px;font-size:.9rem;line-height:1.55}
  .wbody > * + *{margin-top:10px}
  .wtab{width:100%;border-collapse:collapse;font-size:.82rem}
  .wtab th{text-align:left;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
  .wtab td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:top}
  .wcalc{background:var(--tint);border:1px solid var(--line);padding:12px}
  .wcalc + .wcalc{margin-top:10px}
  .wnav{border:1px solid var(--line);background:#fff;color:var(--teal);font-size:.8rem;font-weight:600;padding:6px 10px}

  .evstep{border-left:3px solid var(--ice);padding:6px 0 6px 12px}
  .evfuel summary{cursor:pointer;color:var(--teal);font-weight:600}

  .fblk{background:var(--tint);border-left:3px solid var(--ice);padding:8px 10px}
  .fblk .fl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
  .hpane .fblk{background:#f2f7f8}

  .fblk{display:flex;gap:10px;align-items:flex-start}
  .fblk .fic{color:var(--teal);margin-top:1px}
  .fstrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fsi{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;background:#fff;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink)}
  .fsi svg{color:var(--teal)}
  .hpane .fsi{background:#f2f7f8}
  .evstep{display:flex;gap:10px}
  .evstep > .fic{color:var(--teal);margin-top:2px}
  .rules li{display:flex;gap:8px;align-items:flex-start;list-style:none}
  .rules li svg{color:var(--teal);margin-top:2px}

  .hgrp{margin-top:12px}
  .hgl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ice);margin-bottom:6px}
  .hstrip{display:flex;flex-wrap:wrap;gap:6px}
  .hsi{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);font-size:.8rem;color:#fff}
  .hsi svg{color:var(--ice)}

  .hmeta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:6px}
  .hmeta b{font-size:1.25rem}
  .hmeta span{font-size:.8rem;opacity:.7}
  .hsec{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
  .hrow{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
  .cyc-w{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cyc-c{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 5px;border:1px solid transparent;border-top-width:4px;min-width:0;line-height:1.15}
  .cyc-c b{font-size:1rem}
  .cyc-c.now{box-shadow:0 0 0 2px var(--ink)}
  .cyc-c.past{opacity:.45}
  .cyc-d{font-size:.66rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
  .cyc-m{height:11px;display:flex;gap:3px;align-items:center;font-size:.72rem;font-weight:700;color:var(--ink)}
  .cyc-k{display:inline-block;width:8px;height:8px;background:var(--ink)}
  .cyc-l{background:transparent;border:2px solid var(--ink)}
  .cyc-dot{display:inline-block;width:10px;height:10px;border-radius:50%}
  .cyc-pill{display:inline-block;padding:1px 8px;font-size:.78rem;font-weight:700;color:#fff;border-radius:999px}
  .hrow svg{color:var(--ice);margin-top:1px}
  .hrm{font-size:.92rem;font-weight:600}
  .hrs{font-size:.8rem;opacity:.72}
  .hlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}

  /* ---- Überarbeitung: ruhigere Schrift, Navigation unten, Dunkelmodus ---- */
  html{background:var(--bg)}
  :root{--btnbg:var(--ink);--btnfg:#fff;--heroBg:var(--navy)}
  .hd{font-family:'Geist',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-weight:700!important;letter-spacing:-.015em;text-transform:none;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:break-word}
  h1.hd,.brand .hd,.hd.text-5xl,.hd.text-4xl,.hdx{font-family:'Arial Black',Impact,'Geist',sans-serif;font-weight:900!important;letter-spacing:-.02em;text-transform:uppercase}
  .hero .hd.text-3xl{font-size:1.75rem;font-weight:800!important;line-height:1.15}
  .btn{background:var(--btnbg);color:var(--btnfg);text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:600;padding:.8rem 1.1rem}
  .ghost{text-transform:none;letter-spacing:0;font-size:.875rem;font-weight:600;padding:.7rem .95rem}
  .ghost:hover{background:var(--ink);color:var(--bg)}
  .hbtn{text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:700;padding:.7rem 1rem}
  .brand .ghost{font-size:.8rem}
  main#app{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 18px rgba(7,23,71,.07)}
  .bnav>div{max-width:36rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .bnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:.72rem;font-weight:600;color:var(--mute);background:none;border:0}
  .bnav button.on{color:var(--teal)}
  .bnav button.on::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--ice)}
  .bnav .ndot{position:absolute;top:7px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:#c0392b}
  .mlist{background:var(--panel);border:1px solid var(--line)}
  .mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;color:var(--ink);background:none;border:0;border-top:1px solid var(--line)}
  .mrow:first-child{border-top:0}
  .mrow:hover{background:var(--tint)}
  .mrow .mi{color:var(--teal);flex:none;display:flex}
  .wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .wsd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;background:var(--panel);border:1px solid var(--line);font-size:.68rem;color:var(--mute);min-width:0;cursor:pointer}
  .wsd .bar{display:block;width:62%;height:4px}
  .wsd b{font-size:.78rem;color:var(--ink);font-weight:600}
  .wsd em{font-style:normal;height:14px;line-height:14px;font-size:.8rem;font-weight:700;color:var(--ok)}
  .wsd .xd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);vertical-align:middle}
  .wsd.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .wsd.today span{color:var(--ink);font-weight:700}
  .wsd.miss b{color:var(--mute);text-decoration:line-through}
  .wsd.pre{opacity:.4}
  .hact{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:stretch}
  .hact .hbtn{flex:1 1 100%}
  .hib{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;padding:6px 8px;font-size:.7rem;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.3);background:transparent;cursor:pointer}
  .hib.on{background:#fff;color:#071747;border-color:#fff}
  .hib svg{color:var(--ice)}.hib.on svg{color:#071747}
  .gcard{display:flex;align-items:center;gap:12px}
  .tipc{display:flex;gap:12px;padding:14px;background:var(--tint);border:1px solid var(--line)}
  .tipc .tic{color:var(--teal);flex:none;margin-top:2px}
  .rvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:10px}
  .rvt{background:var(--tint);padding:8px}
  .rvt b{display:block;font-size:1.05rem}
  .rvt span{font-size:.7rem;color:var(--mute)}
  .rvd{border:1px solid var(--line);padding:10px 12px}
  .rvd summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.9rem}
  .rvd summary span{font-size:.8rem;color:var(--mute)}
  .pchart{width:100%;height:auto;display:block;margin-top:8px}
  .pchart .tx{font-size:9.5px;fill:var(--mute);font-family:inherit}
  .pchart .tg{fill:#c2410c;font-weight:600}
  .pchart .gl0{stroke:var(--line);stroke-width:1}
  .pchart .band{fill:var(--ice);opacity:.18}
  .pchart .goal{stroke:#c2410c;stroke-width:1.5;stroke-dasharray:5 4}
  .pchart .now{stroke:var(--mute);stroke-width:1;stroke-dasharray:2 3}
  .pchart .ftpl{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
  .pchart .tdot{fill:#e11d74;stroke:var(--panel);stroke-width:2}
  .pchart .bp{fill:var(--line)}
  .pchart .bd{fill:var(--teal)}
  .pchart .ctll{fill:none;stroke:#e11d74;stroke-width:2;stroke-linejoin:round}
  .plg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.75rem;color:var(--mute)}
  .plg i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
  .lg-ftp{background:var(--ink)}.lg-band{background:var(--ice);opacity:.35;height:9px!important}.lg-t{background:#e11d74;width:8px!important;height:8px!important;border-radius:50%}.lg-goal{border-top:2px dashed #c2410c;height:0!important}
  .lg-bp{background:var(--line);height:9px!important}.lg-bd{background:var(--teal);height:9px!important}.lg-ctl{background:#e11d74}
  .dzone{margin-top:28px;font-size:.875rem}
  .dzone summary{cursor:pointer;color:var(--mute)}
  .dtabs{margin:4px 0 2px}
  :root[data-theme=dark] .dtabs button.on{background:#2a4a8f;color:#fff}
  .tile,.exbox,.dchip,.dtabs button:not(.on),.wnav,.fsi,.inp,.hpane{background:var(--panel)}
  .hpane{color:var(--ink)}
  .hpane .fblk,.hpane .fsi{background:var(--tint)}
  .exph.on{background:var(--tint)}
  .hero{background:var(--heroBg)}
  :root[data-theme=dark]{color-scheme:dark;--bg:#0a1324;--panel:#111d33;--line:#25344f;--ink:#e6edf6;--mute:#93a5bb;--tint:#16243d;--teal:#3cc7c0;--ok:#34c79a;--btnbg:#00bcb3;--btnfg:#04212a;--heroBg:#0f2154}
  :root[data-theme=dark] .brand{background:#071334;box-shadow:0 0 0 100vmax #071334}
  :root[data-theme=dark] .panel{box-shadow:none}
  :root[data-theme=dark] .hd2{fill:var(--ink)}
  :root[data-theme=dark] .ln polyline{stroke:var(--ink)}
  :root[data-theme=dark] .eq{fill:var(--panel)}
  :root[data-theme=dark] .exov{background:rgba(0,0,0,.7)}
  :root[data-theme=dark] .bnav{box-shadow:none}
  :root[data-theme=dark] .pchart .tg{fill:#fb8a4c}
  :root[data-theme=dark] .pchart .goal{stroke:#fb8a4c}
  :root[data-theme=dark] .gltip{background:#1d2c4a}

  .feelb{background:var(--tint);border:1px solid var(--line);padding:12px;margin-top:6px;color:var(--ink)}
  .hpane .feelb{background:transparent;border:0;padding:0;margin:0}
  .feelo{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;padding:10px 12px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  .feelo span{font-size:.78rem;color:var(--mute)}
  .feelo:hover,.feelo.on{border-color:var(--ice)}
  .feelo.on{box-shadow:inset 3px 0 0 var(--ice)}
  .comfix{display:inline-flex;align-items:center;padding:6px 10px;background:var(--tint);border:1px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap}

  .cloc{padding:5px 9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:.78rem;font-weight:600}
  .cloc.on{background:var(--ice);border-color:var(--ice);color:#071747}
  .hpane .cloc:not(.on){background:var(--tint)}
  .hact .hib{flex:1 1 0;min-width:0;padding:6px 4px;text-align:center;line-height:1.15}
  .recb{display:inline-block;padding:2px 8px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--teal);color:#fff}
  .i18nwait #app{visibility:hidden}
</style>
</head>
<body>

<script>
/* ---------- Daten & Zustand ---------- */
const K = 'kurbelwerk.v2';
const iso = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const todayIdx = () => (new Date().getDay() + 6) % 7;

const TYPES = {
  com:  {l:'Pendeln',IF:.55,c:'#2dd4bf'},
  rest: {l:'Ruhetag',   IF:0,   c:'#8d9aa8'},
  rec:  {l:'Rekom',     IF:.55, c:'#34d399'},
  base: {l:'Grundlage', IF:.66, c:'#62c7ff'},
  long: {l:'Long Ride',IF:.70,c:'#818cf8'},
  sst:  {l:'Sweet Spot',IF:.89, c:'#fbbf24'},
  thr:  {l:'Schwelle',  IF:.96, c:'#fb923c'},
  vo2:  {l:'VO2max',    IF:1.0, c:'#f87171'},
  race: {l:'Zwischenevent', IF:.85, c:'#0b1c49'},
  test: {l:'Fitness-Check', IF:.88, c:'#e11d74'}
};
const HARD = ['sst','thr','vo2'];

/* ---------- Übungs-Lexikon: Erklärung und Grafik pro Krafttrainingsübung ---------- */
const EXG = {GY:158, T1:34, T2:34, TR:42, FOOT:13};
function exLimb(a, b, c){ return `<polyline points="${a[0].toFixed(1)},${a[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}${c ? ' ' + c[0].toFixed(1) + ',' + c[1].toFixed(1) : ''}" fill="none"/>`; }
const exV = (a, l) => [Math.sin(a * Math.PI / 180) * l, Math.cos(a * Math.PI / 180) * l];
function exIK(H, T, l1, l2, dir){
  let dx = T[0] - H[0], dy = T[1] - H[1], d = Math.hypot(dx, dy); const mx = l1 + l2 - .5; if (d > mx) { dx *= mx / d; dy *= mx / d; d = mx; T = [H[0] + dx, H[1] + dy]; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a)), ux = dx / d, uy = dy / d, px = H[0] + ux * a, py = H[1] + uy * a;
  const k1 = [px - uy * h, py + ux * h], k2 = [px + uy * h, py - ux * h]; return {K:dir === 'low' ? (k1[1] > k2[1] ? k1 : k2) : dir > 0 ? (k1[0] > k2[0] ? k1 : k2) : (k1[0] < k2[0] ? k1 : k2), T};
}
/* Stehende Figur von der Seite. o: ax (Knöchel x), ay, th/sh (Winkel Oberschenkel/Unterschenkel von senkrecht nach unten, + = nach vorn), tr (Rumpfneigung), arm: [Ellbogen, Hand] relativ zur Schulter */
function exStand(o){
  const A = [o.ax, o.ay === undefined ? EXG.GY : o.ay], K = [A[0] - exV(o.sh || 0, EXG.T2)[0], A[1] - exV(o.sh || 0, EXG.T2)[1]], H = [K[0] - exV(o.th || 0, EXG.T1)[0], K[1] - exV(o.th || 0, EXG.T1)[1]];
  const tr = (o.tr || 0) * Math.PI / 180, S = [H[0] + Math.sin(tr) * EXG.TR, H[1] - Math.cos(tr) * EXG.TR], Hd = [S[0] + Math.sin(tr) * 11, S[1] - Math.cos(tr) * 11];
  let s = `<g class="ln">${exLimb(H, K, A)}${o.nofoot ? '' : `<polyline points="${A[0]},${A[1]} ${A[0] + EXG.FOOT},${A[1]}" fill="none"/>`}${exLimb(H, S)}`;
  if (o.arm) s += exLimb(S, [S[0] + o.arm[0][0], S[1] + o.arm[0][1]], [S[0] + o.arm[1][0], S[1] + o.arm[1][1]]);
  s += `</g><circle cx="${Hd[0].toFixed(1)}" cy="${Hd[1].toFixed(1)}" r="8" class="hd2"/>`;
  return {svg:s, A, K, H, S};
}
const exBox = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="eq"/>`;
const exPlate = (x, y, r = 8) => `<circle cx="${x}" cy="${y}" r="${r}" class="pl"/>`;
const exArrow = (x1, y1, x2, y2) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 5; return `<g class="ar"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><polyline points="${x2 - h * Math.cos(a - .5)},${y2 - h * Math.sin(a - .5)} ${x2},${y2} ${x2 - h * Math.cos(a + .5)},${y2 - h * Math.sin(a + .5)}" fill="none"/></g>`; };
/* liegende/freie Figuren mit Punkten: Linien aus Punktlisten, Kopf als Kreis */
const exLines = (lines, head, extra = '') => `<g class="ln">${lines.map(l => `<polyline points="${l.map(p => p.join(',')).join(' ')}" fill="none"/>`).join('')}</g><circle cx="${head[0]}" cy="${head[1]}" r="8" class="hd2"/>${extra}`;
const exFrame = (inner, cap) => `<div class="exf"><svg viewBox="0 0 170 165" role="img" aria-label="${esc(cap)}"><line x1="4" y1="${EXG.GY}" x2="166" y2="${EXG.GY}" class="gr"/>${inner}</svg><div class="exc">${esc(cap)}</div></div>`;

/* ---------- Übungsanimationen: Start- und Endposition werden weich ineinander überführt ---------- */
const _exT = {};
function exTpl(id){
  if (_exT[id]) return _exT[id];
  const st = s => s.replace(/<g class="ar">.*?<\/g>/g, ''), A = st(EXP[id][0]()), B = st(EXP[id][1]()), re = /(?<![A-Za-z])-?\d+(?:\.\d+)?/g;
  const na = (A.match(re) || []).map(Number), nb = (B.match(re) || []).map(Number), pa = A.split(re), pb = B.split(re);
  return _exT[id] = {A, B, na, nb, pa, ok:na.length === nb.length && pa.join('#') === pb.join('#')};
}
const exAnimSvg = id => `<svg viewBox="0 0 170 165" role="img" aria-label="${esc(EXI[id].t)}: Bewegungsablauf als Animation"><line x1="4" y1="${EXG.GY}" x2="166" y2="${EXG.GY}" class="gr"/><g data-ex="${id}">${exTpl(id).A}</g></svg>`;
let _exRaf = 0;
const _ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function exTick(ts){
  const els = document.querySelectorAll('g[data-ex]'); if (!els.length) { _exRaf = 0; return; }
  const ph = ts % 4400, red = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = ph < 700 ? 0 : ph < 1900 ? _ease((ph - 700) / 1200) : ph < 2900 ? 1 : ph < 4100 ? 1 - _ease((ph - 2900) / 1200) : 0;
  if (red) k = ph < 2200 ? 0 : 1;
  els.forEach(el => {
    const T = exTpl(el.dataset.ex);
    if (el._k !== k) {
      let h; if (T.ok) { h = T.pa[0]; for (let i = 0; i < T.na.length; i++) h += (T.na[i] + (T.nb[i] - T.na[i]) * k).toFixed(1) + T.pa[i + 1]; } else h = k < .5 ? T.A : T.B;
      el.innerHTML = h; el._k = k;
    }
    const box = el.closest('.exanim'); if (box) box.querySelectorAll('[data-ph]').forEach(c => c.classList.toggle('on', (k >= .5) === (c.dataset.ph === '1')));
  });
  _exRaf = requestAnimationFrame(exTick);
}
function exAnimStart(){ if (!_exRaf && document.querySelector('g[data-ex]')) _exRaf = requestAnimationFrame(exTick); }
let exOpen = null;
function openEx(id){ if (EXI[id]) { exOpen = id; render(); } }
function closeEx(){ exOpen = null; render(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && exOpen) closeEx(); });
function exModal(){
  if (!exOpen || !EXI[exOpen]) return ''; const e = EXI[exOpen], p = EXP[exOpen];
  return `<div class="exov" onclick="if(event.target===this)closeEx()" role="dialog" aria-modal="true" aria-label="${esc(e.t)}"><div class="exbox"><div class="flex items-start gap-3"><h3 class="hd flex-1 text-2xl font-semibold">${esc(e.t)}</h3><button class="ghost !px-3 !py-1.5" onclick="closeEx()" aria-label="Schließen">Schließen</button></div>
    <p class="mt-1 text-sm" style="color:var(--mute)">Trainiert: ${esc(e.m)}</p>
    <div class="exanim mt-3"><div class="exf">${exAnimSvg(exOpen)}</div><div class="mt-2 flex gap-2"><span class="exph" data-ph="0">${esc(e.cap[0])}</span><span class="exph" data-ph="1">${esc(e.cap[1])}</span></div></div>
    <p class="mt-3 font-semibold">So geht's</p><ol class="mt-1 list-decimal space-y-1 pl-5 text-sm">${e.s.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    <p class="mt-3 font-semibold">Häufige Fehler</p><ul class="mt-1 list-disc space-y-1 pl-5 text-sm">${e.f.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${e.v ? `<p class="mt-3 font-semibold">Variante</p><p class="mt-1 text-sm">${esc(e.v)}</p>` : ''}
    <p class="mt-3 font-semibold">Warum für Radfahrer</p><p class="mt-1 text-sm">${esc(e.r)}</p>
    <p class="mt-3 text-xs" style="color:var(--mute)">Die Animation zeigt den Bewegungsablauf als vereinfachte Strichfigur. Technik vor Gewicht. Bei Schmerzen abbrechen. Lass dir die Übung bei Unsicherheit einmal von einer Trainerin oder einem Trainer zeigen.</p></div></div>`;
}

/* ---------- Dashboard ---------- */
function goalCard(full = true){
  const p = S.p, kg = kgOf(p);
  if (p.goal === 'event') {
    const days = Math.max(0, Math.round((new Date(p.eventDate + 'T12:00:00') - new Date(lstr(new Date()) + 'T12:00:00')) / 864e5));
    const ph = phases(p).find(x => S.wk >= x.from && S.wk <= x.to).name + '-Phase';
    return `${full ? `<h2 class="hd text-2xl font-semibold">${esc(p.eventName || 'Dein Event')}</h2><p class="mt-1 text-sm" style="color:var(--mute)">${fmt(p.eventDate)} · noch ${days} Tage</p>` : `<div class="flex items-end gap-3"><span class="hd text-5xl font-bold leading-none">${days}</span><span class="pb-0.5 text-sm leading-tight" style="color:var(--mute)">Tage bis<br><b class="text-base" style="color:var(--ink)">${esc(p.eventName || 'zum Event')}</b></span></div>`}${p.evDateEst ? `<p class="mt-2 text-sm" style="color:#9a6a00">⚠ Eventdatum ${fmt(p.eventDate)} ist vorläufig (Vorjahrestermin bzw. bekanntes Eventwochenende, noch nicht offiziell bestätigt). Bitte unter „Anpassen“ selbst setzen, sobald der Termin feststeht.</p>` : ''}
      <p class="mt-2 text-sm" style="color:var(--mute)">${p.targetTime ? `Ziel: unter ${esc(p.targetTime)} Std.${spdOf(p) ? ' (Ø ' + f1(spdOf(p)) + ' km/h)' : ''}` : 'Ziel: gut vorbereitet ins Ziel kommen'} · aktuell ${ph} · ${p.ftp} W, ${f1(p.ftp / kg)} W/kg</p>${full ? `<div class="mt-3">${evHtml(p)}</div>` : ''}`;
  }
  if (p.goal === 'ftp') {
    const pr = Math.min(100, Math.max(0, 100 * (p.ftp - 150) / Math.max(1, p.ftpTarget - 150)));

      <p class="mt-1 text-sm">${ef.ch >= 3 ? 'Deine aerobe Effizienz steigt: Bei gleichem Puls trittst du mehr Watt. Das ist ein gutes Zeichen für deine Grundlagenausdauer.' : ef.ch <= -3 ? 'Deine aerobe Effizienz sinkt. Häufige Gründe sind Müdigkeit, eine Pause, wenig Schlaf oder zu wenig Essen und Trinken. Achte auf Erholung.' : 'Deine aerobe Effizienz ist stabil.'}${ef.dec != null ? ` Entkopplung in den letzten Fahrten: im Schnitt ${f1(ef.dec)} %. ${ef.dec <= 5 ? 'Dein Puls bleibt bei gleicher Leistung stabil, die Grundlage trägt über diese Dauer.' : 'Dein Puls steigt in der zweiten Hälfte deutlich. Mehr lange, ruhige Fahrten und genug Trinken helfen.'}` : ''}</p>
      ${ef.hot ? `<p class="mt-1 text-xs" style="color:var(--mute)">${ef.hot} ${ef.hot === 1 ? 'Fahrt' : 'Fahrten'} über 25 °C nicht berücksichtigt, weil Hitze den Puls auch ohne Formverlust steigen lässt.</p>` : ''}`;
  const efInfo = `<details class="mt-2 text-xs" style="color:var(--mute)"><summary class="cursor-pointer" style="color:var(--teal)">Wie wird das berechnet?</summary><p class="mt-1">Effizienzfaktor = Normalized Power ÷ Durchschnittspuls, nur bei gleichmäßigen Fahrten ab 60 Minuten. Entkopplung = Verhältnis Watt pro Puls in der ersten zur zweiten Hälfte, ohne die ersten 10 Minuten. Training hat eine äußere (Watt) und eine innere Seite (Puls, Empfinden), erst beides zusammen zeigt die Anpassung (${pLink('Impellizzeri et al. 2019', 'impell')}). Leistung bei festgelegtem Puls ist ein zuverlässiger Fitnessmarker (${pLink('Lamberts et al. 2011', 'lamberts')}). Die 5-%-Grenze für die Entkopplung ist ein Erfahrungswert aus der Praxis.</p></details>`;
  const duB = !du.best ? `<p class="mt-1 text-sm" style="color:var(--mute)">Dafür braucht es lange Fahrten mit Leistungsdaten, in denen du nach etwa ${Math.round(15 * kg)} kJ Arbeit (15 kJ pro kg, bei dir rund ${hStd(15 * kg / 650)} Std. ruhiges Fahren) noch einmal 5 Minuten hart fährst, z. B. am letzten Anstieg.</p>`
    : `<p class="mt-1 text-sm">Nach ${du.kj} kJ Arbeit hast du noch <b>${Math.round(du.ratio * 100)} %</b> deiner frischen 5-Minuten-Bestleistung erreicht (${du.best.m5L} von ${du.fresh} W, <span data-noi18n>${esc(du.best.n)}</span>).</p>
      <p class="mt-1 text-sm">${du.ratio >= .95 ? 'Sehr gut: Du verlierst kaum Leistung, wenn es lang wird.' : du.ratio >= .88 ? 'Solide. Mit harten Abschnitten am Ende langer Fahrten lässt sich das weiter verbessern.' : 'Hier liegt Potenzial, vor allem für lange Events: harte Abschnitte am Ende langer Fahrten, Verpflegung wie im Rennen.'} Niedrige Werte können auch bedeuten, dass du am Ende einfach nicht voll gefahren bist.</p>`;
  const duInfo = `<details class="mt-2 text-xs" style="color:var(--mute)"><summary class="cursor-pointer" style="color:var(--teal)">Warum ist das wichtig?</summary><p class="mt-1">Ermüdungsresistenz (Durability) gilt neben VO2max, Effizienz und Schwelle als vierte Säule der Ausdauerleistung. Bei langen Rennen entscheidet sie oft, wer vorn bleibt. Die Messmethoden sind noch nicht einheitlich, Ernährung und Hitze haben großen Einfluss (${pLink('Hunter et al. 2025', 'hunter')}). Die Grenzen 95 % und 88 % sind Orientierungswerte der App.</p></details>`;
  const swB = sw.length < 2 ? `<p class="mt-1 text-sm" style="color:var(--mute)">Bewerte nach dem Hochladen deine Einheiten mit 1 bis 10. Ab zwei Wochen mit je mindestens zwei bewerteten Einheiten vergleicht die App, wie sich gleiche Belastung anfühlt.</p>`

      <p class="mt-2 text-sm">${ch >= 20 ? 'Die Einheiten fühlen sich diese Woche deutlich härter an als die gemessene Belastung erwarten lässt. Das ist oft ein frühes Zeichen von Ermüdung: Schlaf, Essen und ein lockerer Tag helfen.' : ch <= -20 ? 'Gleiche Belastung fühlt sich leichter an als zuletzt. Ein gutes Zeichen für deine Form.' : 'Empfinden und gemessene Belastung passen zusammen.'}</p>`; })();
  const swInfo = `<details class="mt-2 text-xs" style="color:var(--mute)"><summary class="cursor-pointer" style="color:var(--teal)">Wie wird das berechnet?</summary><p class="mt-1">Session-RPE nach Foster: Empfinden (1–10) × Dauer in Minuten. Die Methode ist gut untersucht und zuverlässig (${pLink('Haddad et al. 2017', 'haddad')}). Die App vergleicht das Verhältnis zum TSS der Woche mit den Wochen davor. Ein Hinweis kommt ab 20 % Abweichung, das ist ein Orientierungswert.</p></details>`;
  return `<section class="panel p-5"><p class="hd text-xl font-semibold">Leistungsanalyse</p><p class="mt-1 text-sm" style="color:var(--mute)">Aus allen hochgeladenen Fahrten der letzten Wochen, mit Watt, Puls und deinem Empfinden zusammen. Den Plan ändert die App nur auf deinen Wunsch und nie wegen einer einzelnen Fahrt.</p>

}

function whSum(p, w, plan, done, actual){
  const sw = strWeek, sm = strOf(p, w, plan), mb = mobOf(p, w, plan, sm); strWeek = sw;
  let n = 0, nd = 0, pm = 0, dm = 0, pt = 0, dt = 0;
  plan.forEach((x, i) => { if (!x || !x.m) return; n++; pm += x.m; pt += tss(x); const a = actual && actual[i]; if (done[i] || a) { nd++; dm += a ? Math.round(a.sec / 60) : x.m; dt += a ? a.tss : tss(x); } });
  const kS = Object.keys(sm), kM = Object.keys(mb), sd = kS.filter(i => (S.strDone || {})[`${p.start}|${w}|${i}`]).length, md = kM.filter(i => (S.mobDone || {})[`${p.start}|${w}|${i}`]).length;
  const ex = Object.entries(p.exe || {}).filter(([k]) => k.split('-')[0] === String(w)).map(([, v]) => v);
  const exS = ex.filter(v => v.score != null), sc = exS.length ? Math.round(exS.reduce((a, v) => a + v.score, 0) / exS.length) : null;
  const hard = ex.filter(v => v.rpe && v.x && RPEX[v.x.t] && v.rpe > RPEX[v.x.t][1] + 1).length + ex.filter(v => v.feel === 'low').length;
  const rec = (w % 4 === 0 || (p.recW || []).includes(w));
  return {w, n, nd, pm, dm, pt, dt, s:kS.length, sd, mo:kM.length, md, sc, ne:ex.length, hard, rec};
}
function whSnap(w){
  try { if (!S.p || !S.plan || !S.wk || S.wk === w || !hasStarted(S.p) || S.wk > w) return;
    S.p.wh = S.p.wh || {}; S.p.wh[S.wk] = whSum(S.p, S.wk, S.plan, S.done || {}, S.actual || {}); S.p.whNew = S.wk; } catch (e) {}
}
function whMsg(r){
  const pc = r.n ? r.nd / r.n : 1;
  if (r.rec && pc >= .5) return 'Erholungswoche geschafft. In der Erholung passt sich dein Körper an das Training an, jetzt bist du bereit für den nächsten Block.';
  if (pc >= .9) return 'Starke Woche! Du hast fast alles umgesetzt. Genau diese Regelmäßigkeit macht dich schneller.';

}

const SRC = {acsm:wsrc('ACSM/AND/DC 2016', 'https://acuresearchbank.acu.edu.au/item/880yy/position-of-the-academy-of-nutrition-and-dietetics-dietitians-of-canada-and-the-american-college-of-sports-medicine-nutrition-and-athletic-performance'), jeuk:wsrc('Jeukendrup 2014', 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4008807/'), caf:wsrc('ISSN 2021', 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7777221/'), ioc:wsrc('IOC-Konsens 2018', 'https://pubmed.ncbi.nlm.nih.gov/29540367/'), reds:wsrc('IOC-Konsens REDs 2023', 'https://pubmed.ncbi.nlm.nih.gov/37752011/')};
function fuelCalc(p){
  const kg = kgOf(p), t = todayIdx(), started = hasStarted(p), x = started && S.plan ? S.plan[t] : null, m = x ? x.m || 0 : 0;
  const band = m === 0 ? [3, 5, 'Ruhetag oder sehr leicht'] : m < 75 ? [5, 7, 'etwa 1 Std. Training'] : m <= 240 ? [6, 10, '1 bis 4 Std. Training'] : [8, 12, 'mehr als 4 Std. Training'];
  const kcal = x && m ? Math.round(p.ftp * (TYPES[x.t] ? TYPES[x.t].IF : .65) * m * 60 / 1000 / 10) * 10 : 0;
  const rate = mm => mm < 75 ? [0, 30] : mm <= 150 ? [30, 60] : [60, 90], dur = p.goal === 'event' ? ((evProfile(p) || {}).tev || 0) : 0, r = rate(dur), hrs = dur / 60;
  const hourly = m >= 75 ? rate(m) : null;
  let ev = '';
  if (dur) ev = `<div class="wcalc"><p class="font-semibold">Dein Eventtag: ${esc(p.eventName || 'Event')}, etwa ${hm2(dur)} Std.</p>
    ${wtbl(['Was', 'Menge'], [
      ['Kohlenhydrat-Laden', dur > 90 ? `36 bis 48 Std. vorher ${Math.round(kg * 10)} bis ${Math.round(kg * 12)} g pro Tag (10 bis 12 g/kg)` : 'nicht nötig, normal kohlenhydratreich essen'],
      ['Frühstück 3 Std. vorher', `${Math.round(kg * 1)} bis ${Math.round(kg * 3)} g Kohlenhydrate (1 bis 3 g/kg), bekannt und leicht verdaulich`],
      ['Unterwegs pro Stunde', r[1] ? `${r[0]} bis ${r[1]} g Kohlenhydrate${r[1] >= 90 ? ' (Glukose und Fruktose gemischt)' : ''}` : 'Wasser genügt, eventuell kleine Mengen'],
      ['Unterwegs gesamt', r[1] ? `etwa ${Math.round(r[0] * hrs / 10) * 10} bis ${Math.round(r[1] * hrs / 10) * 10} g, zum Beispiel ${Math.ceil(hrs)} Flaschen Sportgetränk (je 40 g) und ${Math.max(0, Math.round((r[1] * hrs - Math.ceil(hrs) * 40) / 25))} Gels (je 25 g)` : '–'],
      ['Trinken pro Stunde', 'etwa 400 bis 800 ml, nach Durst und Hitze; Schweißrate vorher im Training messen'],
      ['Natrium pro Stunde', 'etwa 300 bis 600 mg, bei Hitze und starkem Schwitzen mehr (Praxiswert)']])}<button class="wnav mt-2" onclick="goPg('event');setTimeout(() => wGo('evfuel'), 50)">Ausführliche Ernährungsstrategie fürs Event ›</button></div>`;
  return `<div class="wcalc"><p class="font-semibold">Heute${x ? ': ' + esc(x.n) + (m ? ', ' + mm(m) : '') : ''}</p>
    ${wtbl(['Was', 'Menge für ' + f1(kg) + ' kg'], [
      ['Kohlenhydrate am Tag', `${Math.round(kg * band[0])} bis ${Math.round(kg * band[1])} g (${band[0]} bis ${band[1]} g/kg, ${band[2]})`],
      ['Eiweiß am Tag', `${Math.round(kg * 1.2)} bis ${Math.round(kg * 2)} g, verteilt auf 4 bis 5 Mahlzeiten mit je etwa ${Math.round(kg * .3)} g`],
      ['Energie der Einheit', kcal ? `etwa ${kcal} kcal (Faustregel: geleistete kJ entsprechen ungefähr den verbrauchten kcal)` : '–'],
      ['Unterwegs pro Stunde', hourly ? `${hourly[0]} bis ${hourly[1]} g Kohlenhydrate` : 'nicht nötig, Wasser reicht'],
      ['Danach', m >= 90 ? `${Math.round(kg * 1)} bis ${Math.round(kg * 1.2)} g Kohlenhydrate pro Stunde in den ersten Stunden, wenn morgen wieder trainiert wird, dazu etwa ${Math.round(kg * .3)} g Eiweiß` : `normale Mahlzeit mit etwa ${Math.round(kg * .3)} g Eiweiß`]])}
    <p class="mt-2 text-xs" style="color:var(--mute)">Richtwerte nach ${SRC.acsm} und ${SRC.jeuk}, berechnet mit deinem Gewicht und dem heutigen Plan. Individuelle Verträglichkeit geht vor.</p></div>${ev}`;
}
function wissenPage(p){
  const ftp = p.ftp, Z = [['Z1', 'Aktive Erholung', '< 55 %', 0, 55], ['Z2', 'Grundlage', '56–75 %', 56, 75], ['Z3', 'Tempo', '76–90 %', 76, 90], ['Z4', 'Schwelle', '91–105 %', 91, 105], ['Z5', 'VO2max', '106–120 %', 106, 120], ['Z6', 'Anaerobe Kapazität', '121–150 %', 121, 150], ['Z7', 'Sprint, neuromuskulär', '> 150 %', 151, 0]];
  const nav = [['w-calc', 'Verpflegungsrechner'], ['w-alltag', 'Ernährung im Alltag'], ['w-vor', 'Vor dem Training'], ['w-waehrend', 'Während der Fahrt'], ['w-nach', 'Nach dem Training'], ['w-supp', 'Supplemente'], ['w-energie', 'Energieverfügbarkeit'], ['w-sex', 'Frauen und Männer'], ['w-zeit', 'Wenig Zeit?'], ['w-train', 'Trainingsgrundlagen'], ['w-zonen', 'Zonen und Kennzahlen'], ['w-erh', 'Erholung und Schlaf'], ['w-race', 'Renntaktik'], ['w-src', 'Quellen']];
  return `<p class="text-sm" style="color:var(--mute)">Das Wichtigste aus Trainingslehre und Sporternährung, kurz erklärt. Der Schwerpunkt liegt auf Verpflegung, weil sie bei langen Ausfahrten oft über Erfolg oder Einbruch entscheidet.</p>
    <div class="flex flex-wrap gap-2">${nav.map(([id, l]) => `<button class="wnav" onclick="wGo('${id}')">${l}</button>`).join('')}</div>
    ${wsec('w-calc', 'Dein Verpflegungsrechner', 'Persönliche Mengen für heute und dein Event', fuelCalc(p), true)}
    ${wsec('w-alltag', 'Ernährung im Alltag', 'Kohlenhydrate nach Trainingslast, Eiweiß, Mikronährstoffe', `
      <p><b>Kohlenhydrate nach Belastung dosieren.</b> Der Bedarf richtet sich nach dem Training des Tages, nicht nach einer festen Diät. An lockeren Tagen reicht weniger, an langen Tagen deutlich mehr.</p>
      ${wtbl(['Trainingstag', 'Kohlenhydrate pro kg Körpergewicht'], [['leicht oder Ruhetag', '3–5 g'], ['moderat, etwa 1 Std.', '5–7 g'], ['1–3 Std. mit Intensität', '6–10 g'], ['mehr als 4–5 Std.', '8–12 g']])}
      <p><b>Eiweiß:</b> 1,2 bis 2,0 g pro kg und Tag, am besten gleichmäßig verteilt, etwa 0,3 g pro kg je Mahlzeit (meist 20 bis 40 g). Gute Quellen: Milchprodukte, Eier, Fisch, Fleisch, Hülsenfrüchte, Tofu.</p>
      <p><b>Fett:</b> deckt den Rest. Nicht dauerhaft unter etwa 20 % der Energie gehen, weil sonst fettlösliche Vitamine und Hormone leiden.</p>
      <p><b>Mikronährstoffe:</b> Eisen (vor allem bei Frauen und vegetarischer Ernährung, Ferritin beim Arzt prüfen lassen), Vitamin D im Winter, Kalzium. Bei veganer Ernährung Vitamin B12 ergänzen.</p>
      <p class="text-xs" style="color:var(--mute)">Quelle: ${SRC.acsm}.</p>`)}
    ${wsec('w-vor', 'Vor dem Training und am Renntag', 'Frühstück, Kohlenhydrat-Laden, Timing', `
      <p><b>1 bis 4 Std. vorher:</b> 1 bis 4 g Kohlenhydrate pro kg. Je näher am Start, desto kleiner und leichter verdaulich: wenig Fett, Ballaststoffe und Eiweiß. Beispiele: Haferflocken mit Banane und Honig, Weißbrot mit Marmelade, Reis.</p>
      <p><b>Kohlenhydrat-Laden:</b> Für Events über 90 Minuten 36 bis 48 Std. vorher 10 bis 12 g pro kg und Tag. Das füllt die Glykogenspeicher. Praktisch: mehr Reis, Nudeln, Brot, Saft, dafür weniger Rohkost und Ballaststoffe.</p>
      <p><b>Nichts Neues am Renntag.</b> Frühstück, Gels und Getränke vorher im Training testen.</p>
      <p><b>Lockere Einheiten nüchtern?</b> Kurze, lockere Fahrten ohne Frühstück sind möglich. Harte oder lange Einheiten fährt man besser mit vollen Speichern.</p>
      <p class="text-xs" style="color:var(--mute)">Quelle: ${SRC.acsm}.</p>`)}
    ${wsec('w-waehrend', 'Während der Fahrt', 'Wie viel, was und wann: Kohlenhydrate, Trinken, Salz', `
      ${wtbl(['Dauer der Belastung', 'Kohlenhydrate pro Stunde', 'Art'], [['unter 45 Min.', 'nicht nötig', 'Wasser'], ['45–75 Min.', 'kleine Mengen oder Mundspülung', 'Getränk'], ['1–2 Std.', 'bis 30 g', 'Getränk, Gel, Riegel'], ['2–3 Std.', 'bis 60 g', 'Glukose-haltig'], ['über 2,5 Std.', 'bis 90 g', 'Glukose und Fruktose gemischt']])}
      <p><b>Früh anfangen, regelmäßig nachlegen:</b> ab der ersten halben Stunde alle 15 bis 20 Minuten etwas. Wer erst bei Hunger isst, ist zu spät.</p>
      <p><b>Der Darm ist trainierbar.</b> Hohe Mengen (60 bis 90 g pro Stunde) in langen Trainingseinheiten üben, wöchentlich um etwa 10 bis 20 g steigern. Wer das nicht übt, bekommt im Rennen oft Magenprobleme.</p>
      ${wtbl(['Lebensmittel', 'Kohlenhydrate etwa'], [['Gel', '20–30 g'], ['Sportriegel', '25–45 g'], ['Banane', '25 g'], ['500 ml Sportgetränk (6–8 %)', '30–40 g'], ['Reiskuchen, Laugengebäck', '20–40 g'], ['Gummibärchen, 50 g', '40 g']])}
      <p><b>Trinken:</b> meist 400 bis 800 ml pro Stunde, je nach Hitze und Schweißrate. Ziel ist, nicht mehr als etwa 2 % Körpergewicht zu verlieren, aber auch nicht mehr zu trinken, als man ausschwitzt. Schweißrate messen: vor und nach einer Stunde Fahrt nackt wiegen, getrunkene Menge dazurechnen.</p>
      <p><b>Salz:</b> etwa 300 bis 600 mg Natrium pro Stunde ist ein gängiger Praxiswert, bei Hitze und salzigen Schweißrändern auf der Kleidung mehr. Bei Ultra-Events nie nur reines Wasser in großen Mengen trinken.</p>
      <p class="text-xs" style="color:var(--mute)">Quellen: ${SRC.jeuk}, ${SRC.acsm}.</p>`)}
    ${wsec('w-nach', 'Nach dem Training', 'Regeneration und Auffüllen', `
      <p><b>Eiweiß:</b> etwa 0,3 g pro kg in den ersten Stunden, zum Beispiel Quark, Joghurt, Milchshake, Eier oder eine normale Mahlzeit.</p>
      <p><b>Kohlenhydrate:</b> Nur wenn weniger als 8 Std. bis zur nächsten harten Einheit bleiben, zählt Tempo: 1,0 bis 1,2 g pro kg pro Stunde über etwa 4 Std. Sonst reichen die normalen Mahlzeiten.</p>
      <p><b>Flüssigkeit:</b> etwa 1,25 bis 1,5 Liter je kg Gewichtsverlust, mit etwas Salz (zum Beispiel salzige Mahlzeit oder Brühe).</p>
      <p class="text-xs" style="color:var(--mute)">Quelle: ${SRC.acsm}.</p>`)}
    ${wsec('w-supp', 'Supplemente mit Evidenz', 'Koffein, Nitrat und worauf du achten solltest', `
      <p><b>Koffein:</b> 3 bis 6 mg pro kg etwa 60 Min. vor dem Start verbessern die Ausdauerleistung messbar. Auch kleinere Mengen später im Rennen wirken. Über 6 mg pro kg nehmen Nebenwirkungen zu (Zittern, Magen, Schlaf). Vorher testen.</p>
      <p><b>Nitrat (Rote-Bete-Saft):</b> etwa 5 bis 9 mmol 2 bis 3 Std. vor der Belastung. Der Effekt ist bei Freizeitsportlern eher größer als bei Profis.</p>
      <p><b>Vorsicht bei Nahrungsergänzung:</b> Viele Produkte sind wirkungslos, manche verunreinigt. Bei Wettkämpfen mit Dopingkontrollen nur geprüfte Produkte (zum Beispiel aus der Kölner Liste) verwenden.</p>
      <p class="text-xs" style="color:var(--mute)">Quellen: ${SRC.caf}, ${SRC.ioc}.</p>`)}

    ${wsec('w-sex', 'Frauen und Männer', 'Was beim Training wirklich anders ist und was nicht', `
      <p><b>Gleiches Grundprinzip:</b> Frauen und Männer passen sich auf Ausdauer- und Krafttraining sehr ähnlich an. Deshalb nutzt die App für beide denselben Planaufbau. Unterschiede gibt es bei Einordnung, Ernährung und Gesundheit.</p>
      <p><b>Leistungswerte einordnen:</b> Bei gleichem Trainingsstand liegen die W/kg-Werte von Frauen im Mittel etwa 10 bis 15 % niedriger. Die App berücksichtigt das bei der Einstufung deines Niveaus. Die Zielzeit rechnet sie direkt aus deinen Watt und deinem Gewicht.</p>
      <p><b>Menstruationszyklus:</b> Eine große Übersichtsarbeit fand im Mittel nur eine sehr kleine Leistungsminderung in der frühen Follikelphase (während der Periode), mit großen Unterschieden zwischen Frauen. Empfehlung: den eigenen Zyklus und das Befinden beobachten und flexibel reagieren, statt den Plan starr nach Phasen auszurichten (${wsrc('McNulty et al. 2020', 'https://nrl.northumbria.ac.uk/id/eprint/43759')}).</p>
      <p><b>Eisen:</b> Frauen haben durch die Menstruation einen höheren Eisenbedarf und häufiger einen Eisenmangel, auch ohne Blutarmut. Müdigkeit und stagnierende Leistung können ein Zeichen sein. Ferritin ärztlich prüfen lassen und eisenreich essen (Fleisch, Hülsenfrüchte, Vollkorn, kombiniert mit Vitamin C) (${wsrc('Alaunyte et al. 2015', 'https://pubmed.ncbi.nlm.nih.gov/26448737/')}).</p>
      <p><b>Energiemangel (REDs):</b> betrifft beide Geschlechter. Warnzeichen bei Frauen: ausbleibende oder unregelmäßige Periode. Bei Männern: weniger Lust auf Sex, anhaltende Müdigkeit, häufige Infekte. Dann ärztlich abklären lassen.</p>
      <p><b>Kohlenhydrat-Laden:</b> Frauen brauchen dafür, wie Männer, wirklich 10 bis 12 g pro kg. Das ist oft mehr, als sich normal anfühlt. Der Verpflegungsrechner rechnet mit deinem Gewicht.</p>
      <p><b>Wechseljahre und Alter:</b> Mit sinkendem Östrogen (Frauen) und allgemein ab etwa 40 werden Krafttraining, ausreichend Eiweiß und Erholung wichtiger, auch für die Knochen.</p>
      <p><b>Schwangerschaft und nach der Geburt:</b> Training ist meist möglich und sinnvoll, sollte aber mit Ärztin oder Arzt abgestimmt werden. Die App ist dafür nicht ausgelegt.</p>
      <p class="text-xs" style="color:var(--mute)">Grenze: Die meisten Studien zur Trainingssteuerung wurden mit Männern gemacht. Für Frauen ist die Datenlage dünner.</p>`)}
    ${wsec('w-energie', 'Energieverfügbarkeit', 'Warum zu wenig essen der Leistung schadet', `
      <p>Wer dauerhaft weniger isst, als Training und Alltag verbrauchen, riskiert eine relative Energiemangel-Situation (REDs): schlechtere Erholung, häufigere Infekte und Verletzungen, Knochenschwäche, Zyklusstörungen, Leistungsabfall. Das betrifft Frauen und Männer.</p>
      <p>Warnzeichen sind anhaltende Müdigkeit, stagnierende Leistung trotz Training, häufige Krankheit und bei Frauen ausbleibende Periode. Dann ärztlich abklären lassen und die Energiezufuhr nicht weiter einschränken.</p>
      <p>Die App gibt bewusst keine Diät- oder Abnehmempfehlungen. Wenn Essen und Gewicht dich belasten, sprich mit einer Ärztin, einem Arzt oder einer Ernährungsfachkraft.</p>
      <p class="text-xs" style="color:var(--mute)">Quelle: ${SRC.reds}.</p>`)}
    ${wsec('w-zeit', 'Wenig Zeit?', 'Intensität statt Umfang und Hebel am Renntag', `
      <p><b>Intensität kann Umfang teilweise ersetzen.</b> Intervalltraining verbessert VO2max und FTP mit wenig Zeitaufwand ähnlich stark wie deutlich mehr lockeres Training, besonders bei Hobbyfahrern (${wsrc('Gibala et al. 2006', 'https://coachsci.sdsu.edu/csa/vol191/gibala.htm')}). Auch bei trainierten Radfahrern bringen gezielte Intervallblöcke weiter Leistung (${wsrc('Meta-Analyse 2024', 'https://researchonline.ljmu.ac.uk/24748/1/Physiological%20and%20Performance%20Adaptations%20to%20Interval%20Training%20in%20Endurance%20Trained%20Cyclists%20An%20Exploratory%20Systematic%20Review%20and%20Meta%20Analysis.pdf')}).</p>
      <p><b>Die Grenzen:</b> Mehr als 2 bis 3 harte Einheiten pro Woche verkraften die meisten nicht dauerhaft. Und die Fähigkeit, nach vielen Stunden noch Leistung abzurufen, kommt vor allem aus langen Fahrten. Darum bietet die App „Intensität statt Umfang“ für FTP-Ziele und Events bis etwa 3 Std. an. Bei langen Events bleibt der Long Ride wichtig.</p>
      <p><b>Krafttraining:</b> Schweres Krafttraining verbessert bei Radfahrern Ökonomie und Leistung am Ende langer Fahrten (${wsrc('Frontiers in Physiology 2019', 'https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2019.01132/pdf')}). Für Zeitknappe ein guter Tausch.</p>
      <p><b>Am Renntag:</b> Verpflegung (60 bis 90 g Kohlenhydrate pro Stunde, im Training geübt), gleichmäßiges Pacing und Koffein (etwa 3 mg pro kg, ${wsrc('Meta-Analyse Radsport', 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12832238/')}) bringen oft mehr Minuten als ein paar Watt FTP. Im Plan-Check kannst du diese Hebel in deinen Plan übernehmen.</p>
      <p><b>Außerdem:</b> Tapering vor dem Event, Regelmäßigkeit, Schlaf und genug Essen. Im Flachen und in der Gruppe zählen Sitzposition, Kleidung, Reifen und Windschattenfahren oft mehr als Training. Bei Sommerevents helfen ein bis zwei Wochen Training in der Wärme.</p>`)}
    ${wsec('w-train', 'Trainingsgrundlagen', 'Belastung und Anpassung, Periodisierung, Intensitätsverteilung', `
      <p><b>Belastung plus Erholung ergibt Anpassung.</b> Training ist der Reiz, stärker wirst du in der Erholung. Das Modell der „Superkompensation“ veranschaulicht das, ist aber eine Vereinfachung.</p>
      <p><b>Progressive Steigerung:</b> Umfang und Intensität wachsen schrittweise. Die App steigert um etwa 8 % pro Woche und legt jede vierte Woche eine Entlastungswoche ein.</p>
      <p><b>Periodisierung:</b> Basis (Grundlage), Aufbau (Schwelle und VO2max), Spitze (eventspezifisch), Tapering (Umfang runter, Intensität bleibt). So baut eine Fähigkeit auf der anderen auf.</p>
      <p><b>Intensitätsverteilung:</b> Etwa 80 % der Zeit locker, 20 % moderat bis hart. Zu viele mittelharte Einheiten machen müde, ohne viel zu bringen.</p>
      <p><b>Spezifität:</b> Je näher das Ziel, desto ähnlicher wird das Training der Belastung des Events (lange Anstiege, kurze Rampen, Tempo im Feld).</p>`)}
    ${wsec('w-zonen', 'Zonen und Kennzahlen', 'Deine Wattbereiche und was FTP, TSS und CTL bedeuten', `
      ${wtbl(['Zone', 'Bereich', '% FTP', 'Deine Watt'], Z.map(z => [z[0], z[1], z[2], z[4] ? (z[3] ? Math.round(ftp * z[3] / 100) + '–' + Math.round(ftp * z[4] / 100) + ' W' : 'bis ' + Math.round(ftp * z[4] / 100) + ' W') : '> ' + Math.round(ftp * 1.5) + ' W']))}
      <p><b>FTP:</b> die Leistung, die du etwa eine Stunde halten kannst. Test: 20 Min. maximal fahren, Durchschnitt × 0,95.</p>
      <p><b>W/kg:</b> FTP geteilt durch Körpergewicht, am Berg die entscheidende Größe.</p>
      <p><b>Normalized Power (NP):</b> gewichtet harte Phasen stärker als der Durchschnitt und beschreibt die tatsächliche Belastung besser.</p>
      <p><b>TSS:</b> Belastung einer Einheit. 1 Std. an der FTP sind 100 Punkte.</p>
      <p><b>Fitness, Ermüdung, Frische (CTL, ATL, TSB):</b> gleitende Mittel der täglichen Belastung über 42 und 7 Tage. Frische ist die Differenz, vor einem Event soll sie leicht positiv sein.</p>`)}
    ${wsec('w-erh', 'Erholung und Schlaf', 'Was die Anpassung möglich macht', `
      <p><b>Schlaf:</b> 7 bis 9 Std. Er ist die wirksamste Erholungsmaßnahme. Nach harten Tagen eher mehr.</p>
      <p><b>Warnzeichen für Überlastung:</b> anhaltende Müdigkeit, schlechter Schlaf, erhöhter Ruhepuls, Lustlosigkeit, Leistung sinkt trotz Training. Dann 2 bis 3 lockere Tage oder Pause einlegen. Die App fragt nach harten Fahrten nach deinem Befinden und passt den Plan an.</p>
      <p><b>Krank?</b> Faustregel: Bei leichten Beschwerden oberhalb des Halses höchstens locker fahren. Bei Fieber, Gliederschmerzen oder Beschwerden in Brust und Bauch kein Training, auch keine lockere Runde.</p>
      <p><b>Ruhetage</b> sind Teil des Plans und kein verlorenes Training.</p>`)}
    ${wsec('w-race', 'Renntaktik und Pacing', 'Gleichmäßig fahren, Windschatten nutzen, richtig verpflegen', `
      <p><b>Gleichmäßig pacen:</b> Die erste Stunde bewusst kontrolliert fahren. Wer am Anfang überzieht, verliert hinten ein Vielfaches.</p>
      <p><b>Am Berg:</b> lange Anstiege eher bei 80 bis 90 % FTP (je nach Renndauer), kurze Rampen dürfen kurz darüber liegen. Im Flachen und bergab erholen.</p>
      <p><b>Windschatten:</b> In der Gruppe sparst du viel Kraft. Positionierung im vorderen Drittel vermeidet Ziehharmonika-Effekte nach Kurven.</p>
      <p><b>Verpflegungsplan:</b> vorher festlegen, wann du isst und trinkst (zum Beispiel alle 20 Min.), und am Rad oder Vorbau notieren. Labestationen vorher anschauen.</p>
      <p><b>Material:</b> nichts Neues am Renntag. Reifendruck, Ersatzschlauch, Werkzeug, Licht bei Ultra-Events.</p>`)}
    ${wsec('w-src', 'Wissenschaftliche Grundlage', 'Quellen der App und ihre Grenzen', (sources().match(/<div class="px-4 pb-4">([\s\S]*)<\/div><\/section>$/) || [, ''])[1])}`;
}

/* Plantitel automatisch nachführen, solange der Titel nicht selbst vergeben wurde (auch für ältere gespeicherte Pläne) */
const isAutoName = n => !n || n === 'Event-Plan' || /^FTP-Ziel \d+ W$/.test(n) || /^(Fitness|Ausdauer: .*|Schneller werden|Fit und gesund|Wiedereinstieg) bis /.test(n) || EVS.some(e => n === e.n || n === e.n + (e.v ? ' ' + e.v : ''));
function syncNames(){
  try {
    if (S.p && S.pid && !S.pnameManual && isAutoName(S.pname) && S.pname !== planName(S.p)) S.pname = planName(S.p);
    const lib = readLib(); let ch = false;
    Object.values(lib.plans).forEach(e => { const pp = e.snap && e.snap.p; if (pp && !e.manual && isAutoName(e.name) && e.name !== planName(pp)) { e.name = planName(pp); ch = true; } });
    if (ch) localStorage.setItem(LIBK, JSON.stringify(lib));
  } catch (e) {}
}
/* ---------- Sprache: Deutsch ist die Quelle. Englisch entsteht nach jedem Seitenaufbau satzweise aus dem Wörterbuch I18N.
   Zahlen, Daten, Wochentage und Namen in „…“ sind Platzhalter {0}, {1} … und werden passend umformatiert. ---------- */
const lang = () => (S && S.lang === 'en') ? 'en' : 'de';
function setLang(l){ S.lang = l || (lang() === 'en' ? 'de' : 'en'); save(); render(); }
const langBtn = ml => `<button onclick="setLang()" class="ghost ${ml ? 'ml-auto ' : ''}!px-2.5 !py-1.5 text-sm" data-noi18n aria-label="${lang() === 'en' ? 'Auf Deutsch umschalten' : 'Switch to English'}">${lang() === 'en' ? 'DE' : 'EN'}</button>`;
const I_WD = {Montag:'Monday', Dienstag:'Tuesday', Mittwoch:'Wednesday', Donnerstag:'Thursday', Freitag:'Friday', Samstag:'Saturday', Sonntag:'Sunday', Mo:'Mon', Di:'Tue', Mi:'Wed', Do:'Thu', Fr:'Fri', Sa:'Sat', So:'Sun'};
const I_MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'], I_MONEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const I_RE = new RegExp('„([^“]{1,90})“|((?:(?:Mo|Di|Mi|Do|Fr|Sa|So)\\.,\\s)?\\d{1,2}\\.\\s(?:' + I_MON.join('|') + ')(?:\\s\\d{4})?)|(\\d{1,2}\\.\\d{1,2}\\.(?:\\d{4})?)|\\b(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)\\b|\\b(Mo|Di|Mi|Do|Fr|Sa|So)\\b(?=\\s?[+\\d→·,)]|\\s*$)|(\\d+(?:[.,:]\\d+)*)', 'g');
function iNorm(s){ const v = []; const k = s.replace(I_RE, (m, q, ld, nd, wd, sd, n) => { v.push(q != null ? ['q', q] : ld ? ['L', ld] : nd ? ['D', nd] : wd ? ['d', wd] : sd ? ['d', sd] : ['n', n]); return '{' + (v.length - 1) + '}'; }); return {k, v}; }
function iVal(x){
  const [t, r] = x;
  if (t === 'n') return /^\d{1,3}(\.\d{3})+$/.test(r) ? r.replace(/\./g, ',') : r.replace(/,/g, '.');
  if (t === 'd') return I_WD[r] || r;
  if (t === 'D') { const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})?$/.exec(r); return m ? `${m[1]}/${m[2]}${m[3] ? '/' + m[3] : ''}` : r; }
  if (t === 'L') { const m = /(?:(Mo|Di|Mi|Do|Fr|Sa|So)\.,\s)?(\d{1,2})\.\s(\S+)(?:\s(\d{4}))?/.exec(r); return m ? `${m[1] ? I_WD[m[1]] + ', ' : ''}${+m[2]} ${I_MONEN[I_MON.indexOf(m[3])] || m[3]}${m[4] ? ' ' + m[4] : ''}` : r; }
  if (t === 't') return trS(r);
  if (t === 'q') return '“' + trS(r) + '”';
  return r;
}
let I18N = {};
/* Englisches Wörterbuch komprimiert in der Datei, wird erst bei Bedarf entpackt */
let i18nReady = false, i18nLoading = null;
function i18nLoad(){
  if (i18nReady) return Promise.resolve(true);
  if (!i18nLoading) i18nLoading = (async () => { try { const el = document.getElementById('i18n-en'), b = Uint8Array.from(atob(el.textContent.trim()), c => c.charCodeAt(0)); const st = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip')); I18N = JSON.parse(await new Response(st).text()); i18nReady = true; } catch (e) { i18nReady = false; } document.documentElement.classList.remove('i18nwait'); return i18nReady; })();
  return i18nLoading;
}
