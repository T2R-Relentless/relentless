# Relentless auf Netlify: statische App (aus src/ gebaut) plus Garmin-Vermittler.
# Die Funktion legt ihre Adresse /api/garmin selbst fest (config.path in garmin.mjs), eine Weiterleitung ist nicht nötig.
# Caching: Netlify liefert Dateien standardmäßig mit "max-age=0, must-revalidate" aus. Das passt zur Update-Prüfung
# (version.json) und zum Service Worker (sw.js), deshalb hier keine eigenen Cache-Regeln.

[build]
  # Baut public/index.html aus src/ (nur Python, keine Abhängigkeiten). Ergebnis ist identisch mit der eingecheckten Datei.
  command = "python3 tools/build.py"
  publish = "public"
  functions = "netlify/functions"
